<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 安全控制中心</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5433/5433006.png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 40px; background-color: #f0f2f5; color: #333; }
        .card { background: white; max-width: 350px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #2c3e50; }
        
        /* ESP32 狀態標籤 */
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 20px; background-color: #e0e0e0; color: #666; transition: 0.3s; }
        .status-online { background-color: #d4edda; color: #155724; }
        .status-offline { background-color: #f8d7da; color: #721c24; }

        /* 按鈕設計 */
        .btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; background-color: #007bff; color: white; border-radius: 10px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }

        /* 打勾動畫 */
        .checkmark-container { display: none; justify-content: center; align-items: center; height: 80px; margin: 10px 0; }
        .checkmark { width: 50px; height: 50px; border-radius: 50%; display: block; stroke-width: 3; stroke: #4bb71b; stroke-miterlimit: 10; box-shadow: inset 0px 0px 0px #4bb71b; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 3; stroke-miterlimit: 10; stroke: #4bb71b; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 30px white; } }

        /* 隱藏區塊 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>智慧燈控系統</h2>
    <div id="espStatusTag" class="status-badge">ESP32 狀態: 連線檢測中...</div>
    
    <div id="unlockSection">
        <button class="btn" id="unlockBtn" disabled>正在連線至伺服器...</button>
        <p id="waitMsg" style="color: #d9534f; font-size: 14px; margin-top: 10px;" class="hidden">⚠️ 另一個裝置正在控制中，請稍候...</p>
    </div>

    <div id="successAnimation" class="checkmark-container">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
    </div>

    <div id="controlSection" class="hidden">
        <p style="color: #28a745; font-weight: bold; margin-bottom: 15px;">解鎖成功，您現在可以控制設備</p>
        <button class="btn btn-on" id="onBtn">💡 開啟 LED</button>
        <button class="btn btn-off" id="offBtn">🌙 關閉 LED</button>
    </div>
</div>

<script>
// ================= 設定區 =================
const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt"; 
const TOPIC_CMD = "myhome/esp32/secure_led_9f8a7b6c5ejgijaohgfhoefh4646gsgnj";       // 傳送指令
const TOPIC_ESP = "myhome/esp32/esp_status_9f8a";  // ESP32 上下線狀態
const TOPIC_WEB = "myhome/esp32/web_status_9f8a";  // 網頁排隊鎖定狀態
const SECRET_KEY = "SuperSecretToken123";

let isUnlockedLocal = false; // 紀錄目前這支手機是否已經解鎖

// 生成隨機 ClientID
const clientId = 'web_' + Math.random().toString(16).substr(2, 8);

// 連線設定 (包含 LWT 遺囑：如果網頁意外關閉，自動發佈 "free" 釋放控制權)
const options = {
    clientId: clientId,
    will: { topic: TOPIC_WEB, payload: "free", qos: 1, retain: true }
};

const client = mqtt.connect(MQTT_BROKER, options);

// 網頁元素綁定
const espStatusTag = document.getElementById('espStatusTag');
const unlockBtn = document.getElementById('unlockBtn');
const waitMsg = document.getElementById('waitMsg');
const unlockSection = document.getElementById('unlockSection');
const successAnimation = document.getElementById('successAnimation');
const controlSection = document.getElementById('controlSection');

// ================= MQTT 邏輯 =================
client.on('connect', () => {
    client.subscribe(TOPIC_ESP);
    client.subscribe(TOPIC_WEB);
    unlockBtn.innerText = "指紋解鎖以開始使用";
    unlockBtn.disabled = false;
});

client.on('message', (topic, message) => {
    const msg = message.toString();

    // 1. 處理 ESP32 連線狀態
    if (topic === TOPIC_ESP) {
        if (msg === "online") {
            espStatusTag.innerText = "🟢 ESP32 已連線";
            espStatusTag.className = "status-badge status-online";
        } else {
            espStatusTag.innerText = "🔴 ESP32 離線中";
            espStatusTag.className = "status-badge status-offline";
        }
    }

    // 2. 處理網頁排隊與鎖定機制
    if (topic === TOPIC_WEB) {
        if (msg === "busy" && !isUnlockedLocal) {
            // 別人正在用，且我還沒解鎖 -> 鎖住按鈕
            unlockBtn.disabled = true;
            unlockBtn.innerText = "等待其他裝置釋放...";
            waitMsg.classList.remove('hidden');
        } else if (msg === "free" && !isUnlockedLocal) {
            // 別人釋放了，換我可以用
            unlockBtn.disabled = false;
            unlockBtn.innerText = "指紋解鎖以開始使用";
            waitMsg.classList.add('hidden');
        }
    }
});

// ================= 生物辨識與控制 =================
unlockBtn.addEventListener('click', async () => {
    if (!window.PublicKeyCredential) {
        alert("您的裝置或瀏覽器不支援生物辨識。"); return;
    }

    try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        
        // 呼叫系統指紋/FaceID
        const credential = await navigator.credentials.create({
            publicKey: {
                challenge: challenge,
                rp: { name: "ESP32 Secure Control" },
                user: { id: new Uint8Array([1]), name: "user", displayName: "User" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                timeout: 60000,
                authenticatorSelection: { 
                    authenticatorAttachment: "platform", // <--- 關鍵！強制使用本機設備 (指紋/FaceID)
                    userVerification: "required"         // 強制要求驗證身份
                }
            }
        });

        if (credential) {
            // 解鎖成功！
            isUnlockedLocal = true;
            
            // 廣播「我很忙 (busy)」，讓其他打開網頁的人等待
            client.publish(TOPIC_WEB, "busy", { retain: true });

            // 隱藏解鎖按鈕，顯示動畫
            unlockSection.classList.add('hidden');
            successAnimation.style.display = 'flex';

            // 1.5 秒後隱藏動畫，顯示開關燈按鈕
            setTimeout(() => {
                successAnimation.style.display = 'none';
                controlSection.classList.remove('hidden');
            }, 1500);
        }
    } catch (err) {
        console.error(err);
        alert("驗證取消或失敗。請確認您的手機已設定指紋或密碼。");
    }
});

// 傳送 MQTT 指令的共用函式
function sendCommand(cmd) {
    const payload = JSON.stringify({ auth: SECRET_KEY, command: cmd });
    client.publish(TOPIC_CMD, payload, { qos: 1 });
}

document.getElementById('onBtn').addEventListener('click', () => sendCommand("ON"));
document.getElementById('offBtn').addEventListener('click', () => sendCommand("OFF"));

// 當使用者關閉網頁或重整時，主動釋放控制權讓別人可以使用
window.addEventListener('beforeunload', () => {
    if (isUnlockedLocal) {
        client.publish(TOPIC_WEB, "free", { retain: true });
    }
});
</script>
</body>
</html>
